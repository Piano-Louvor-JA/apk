name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex: v0.1.2) para anexar os artefatos'
        required: true

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve versao
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  android-apk:
    name: Android APK (release, assinado)
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restaurar keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/louvorja-release.keystore"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$HOME/louvorja-release.keystore
          EOF
          # key.properties é lido pelo build.gradle — igual ao local

      - run: flutter pub get

      - name: Build APK release
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        # API 100% via dart-define (apk#54) — env simples não chega no
        # String.fromEnvironment: tem que ser flag na linha de comando.
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=LOUVORJA_URL_DATABASE=https://api.pianolouvorja.com.br/json_db \
            --dart-define=LOUVORJA_URL_FILES=https://api.pianolouvorja.com.br/file \
            --dart-define=LOUVORJA_FALLBACK_URLS=https://api.louvorja.com.br,https://api.louvorja.workers.dev \
            --dart-define=API_TOKEN="$API_TOKEN"
          VERSION=${{ needs.resolve.outputs.version }}
          cp build/app/outputs/flutter-apk/app-release.apk \
             louvorja-piano-${VERSION#v}.apk

      - name: Attach APK to release (cria se nao existir)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.version }}
          files: louvorja-piano-*.apk

  ios-unsigned-ipa:
    name: iOS IPA (no codesign)
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS (release, no codesign)
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons \
            --dart-define=LOUVORJA_URL_DATABASE=https://api.pianolouvorja.com.br/json_db \
            --dart-define=LOUVORJA_URL_FILES=https://api.pianolouvorja.com.br/file \
            --dart-define=LOUVORJA_FALLBACK_URLS=https://api.louvorja.com.br,https://api.louvorja.workers.dev \
            --dart-define=API_TOKEN="$API_TOKEN"

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry ../louvorja-piano-ios-unsigned.ipa Payload
          cd -
          ls -lh build/ios/louvorja-piano-ios-unsigned.ipa

      - name: Attach IPA to release (cria se nao existir)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.version }}
          files: build/ios/louvorja-piano-ios-unsigned.ipa
