name: CI

# Padrao canonico da org: lint -> typecheck -> test -> build -> regression-gate -> quality-gate
# Mapeamento apk: lint=flutter analyze · typecheck=embutido no analyze · builds de SO = camada extra
on:
  push:
    branches: [main, master, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (flutter analyze)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze (warnings only)
        run: flutter analyze --fatal-warnings --no-fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        env:
          # Token vem de secret (nunca hardcoded). Vazio = sem token.
          API_TOKEN: ${{ secrets.API_TOKEN }}
        # API 100% via dart-define (apk#54) — sem isso o app sai do CI
        # sem onde fazer requisição ("erro sem conexão com o servidor").
        # env simples NÃO chega no String.fromEnvironment: tem que ser flag.
        run: >-
          flutter build apk --debug --no-tree-shake-icons
          --dart-define=LOUVORJA_URL_DATABASE=https://api.pianolouvorja.com.br/json_db
          --dart-define=LOUVORJA_URL_FILES=https://api.pianolouvorja.com.br/file
          --dart-define=LOUVORJA_FALLBACK_URLS=https://api.louvorja.com.br,https://api.louvorja.workers.dev
          --dart-define=API_TOKEN=$API_TOKEN

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 25
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS (debug, no codesign)
        # Paridade com o APK: mesmo sem instalar, o build valida os defines.
        run: |
          flutter build ios --debug --no-codesign --no-tree-shake-icons \
            --dart-define=LOUVORJA_URL_DATABASE=https://api.pianolouvorja.com.br/json_db \
            --dart-define=LOUVORJA_URL_FILES=https://api.pianolouvorja.com.br/file \
            --dart-define=LOUVORJA_FALLBACK_URLS=https://api.louvorja.com.br,https://api.louvorja.workers.dev

  regression-gate:
    name: Regression Gate (anti-regressão)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Baseline (staging)
        run: |
          cp scripts/test-regression.dart /tmp/test-regression.dart
          git checkout staging
          flutter pub get
          dart run /tmp/test-regression.dart --baseline
          git checkout "${{ github.head_ref }}"

      - name: Compare (PR branch)
        run: dart run scripts/test-regression.dart --compare

  # Quality Gate canonico: so passa se TODAS as camadas passaram
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, test, build-android, build-ios, regression-gate]
    if: always()
    steps:
      - name: Verifica se todos os gates passaram
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "build-android: ${{ needs.build-android.result }}"
          echo "build-ios: ${{ needs.build-ios.result }}"
          echo "regression-gate: ${{ needs.regression-gate.result }}"
          FAIL=0
          for r in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.build-android.result }}" "${{ needs.build-ios.result }}"; do
            [[ "$r" != "success" ]] && FAIL=1
          done
          # regression-gate roda so em PR; em push fica skipped e nao bloqueia
          [[ "${{ needs.regression-gate.result }}" == "failure" ]] && FAIL=1
          if [[ "$FAIL" == "1" ]]; then
            echo "::error::Quality Gate FALHOU — corrija os erros antes do merge"
            exit 1
          fi
          echo "Quality Gate PASSOU"
