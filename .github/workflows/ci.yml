name: CI

on:
  push:
    branches: [main, master, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze (warnings only)
        run: flutter analyze --fatal-warnings --no-fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        env:
          # Token vem de secret (nunca hardcoded). Vazio = sem token.
          API_TOKEN: ${{ secrets.API_TOKEN }}
        # API 100% via dart-define (apk#54) — sem isso o app sai do CI
        # sem onde fazer requisição ("erro sem conexão com o servidor").
        # env simples NÃO chega no String.fromEnvironment: tem que ser flag.
        run: >-
          flutter build apk --debug --no-tree-shake-icons
          --dart-define=LOUVORJA_URL_DATABASE=https://api.pianolouvorja.com.br/json_db
          --dart-define=LOUVORJA_URL_FILES=https://api.pianolouvorja.com.br/file
          --dart-define=LOUVORJA_FALLBACK_URLS=https://api.louvorja.com.br,https://api.louvorja.workers.dev
          --dart-define=API_TOKEN=$API_TOKEN

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS (debug, no codesign)
        # Paridade com o APK: mesmo sem instalar, o build valida os defines.
        run: |
          flutter build ios --debug --no-codesign --no-tree-shake-icons \
            --dart-define=LOUVORJA_URL_DATABASE=https://api.pianolouvorja.com.br/json_db \
            --dart-define=LOUVORJA_URL_FILES=https://api.pianolouvorja.com.br/file \
            --dart-define=LOUVORJA_FALLBACK_URLS=https://api.louvorja.com.br,https://api.louvorja.workers.dev

  regression-gate:
    name: Regression Gate (anti-regressão)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Baseline (staging)
        run: |
          cp scripts/test-regression.dart /tmp/test-regression.dart
          git checkout staging
          flutter pub get
          dart run /tmp/test-regression.dart --baseline
          git checkout "${{ github.head_ref }}"

      - name: Compare (PR branch)
        run: dart run scripts/test-regression.dart --compare
