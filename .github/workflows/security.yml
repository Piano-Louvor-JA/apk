name: security

on:
  pull_request:
  push:
    branches: [staging, main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: OSV dependency scan (OWASP A03)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      scan-args: |-
        --lockfile=pubspec.lock
    permissions:
      contents: read
      actions: read
      security-events: write

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CLI open source. A action oficial (gitleaks-action@v2) exige licença paga.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP"
      - name: Scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            "$RUNNER_TEMP/gitleaks" detect --source . --redact --log-opts="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            # Sem --log-opts o gitleaks usa --all e reprova o push da staging
            # por segredo que existe só em outra branch.
            "$RUNNER_TEMP/gitleaks" detect --source . --redact --log-opts="HEAD"
          fi
      - name: Ensure build secrets use dart-define
        run: |
          grep -A3 -q "String.fromEnvironment" lib/core/services/update_service.dart
          grep -A3 "String.fromEnvironment" lib/core/services/update_service.dart | grep -q "GH_TOKEN"
          ! grep -RInE --exclude-dir=.git "Authorization: token ghp_" lib

  analyze:
    name: dart analyze (warning bloqueia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-warnings --no-fatal-infos
