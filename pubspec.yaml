name: louvorja_piano_mobile
description: "LouvorJA PIANO Mobile — App Flutter para gerenciamento de cultos adventistas"
publish_to: "none"
version: 0.4.0+3001

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  xml: any
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.0.0

  # Networking
  dio: ^5.11.1
  crypto: ^3.0.6

  # Routing
  go_router: ^17.5.0

  # Fonts
  google_fonts: ^8.2.1

  # Internationalization
  easy_localization: ^3.0.7

  # Persistent key-value storage (settings)
  shared_preferences: ^2.3.3

  # State provider for application settings
  provider: ^6.1.2

  # Connectivity checking
  connectivity_plus: ^7.3.1

  # Icons (mesma lib do Electron/web, v3.44.0 ≈ v3.45.0)
  tabler_icons_plus: ^3.48.0

  # SVG rendering (logos e brand assets)
  flutter_markdown: ^0.7.6
  flutter_svg: ^2.2.0

  # Native splash runtime removal
  flutter_native_splash: ^2.4.6

  # App version info (lê version do pubspec em runtime)
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0

  # Media
  cached_network_image: ^4.0.2

  # Code generation (runtime annotations)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Logging (substitui print)
  logger: ^2.8.0
  path_provider: ^2.1.6
  audioplayers: ^6.8.1

  # Seleção de mídia local para itens da liturgia (mobile/web)
  # 10.3.9+ quebra registro Android (FilePickerPlugin ausente).
  # ponytail: remover pin quando upstream corrigir regressão #1960.
  file_picker: 13.1.0

  # Abrir URLs externas (site, video online) da liturgia
  url_launcher: ^6.3.1

  # Manter tela acesa durante o culto
  wakelock_plus: ^1.8.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  open_filex: ^4.7.0
  image_picker: ^1.2.3
  flutter_colorpicker: ^1.1.0
  image: ^4.10.1
  archive: ^4.3.0
  flutter_foreground_task: ^11.0.3
  multicast_dns: ^0.3.3+1
  mobile_scanner: ^7.4.2
  flutter_webrtc: ^1.6.2+hotfix.3
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^10.3.4
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Lint
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.8.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  # Brand assets nativos (Android/iOS/Web)
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  # iOS será ativado quando a plataforma iOS for criada em ambiente macOS/Xcode.
  ios: false
  image_path: "assets/images/app-icon-large.png"
  adaptive_icon_background: "#131313"
  adaptive_icon_foreground: "assets/images/app-icon-large.png"

flutter_native_splash:
  # Luminous Clarity (light) / Ethereal Lumens (dark).
  # A splash nativa segue o uiMode do SO antes do Flutter iniciar.
  color: "#F8F9FF"
  color_dark: "#131313"
  image: assets/images/app-icon-large.png
  android_12:
    color: "#F8F9FF"
    color_dark: "#131313"
    image: assets/images/app-icon-large.png
  # Web usa a SplashScreen Flutter interna (evita HTML splash sobreposto).
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/palco/
    - assets/backgrounds/
    - assets/translations/
    - assets/images/
    - assets/images/library/hymnal.jpeg
    - assets/images/library/hymnal_1996.jpeg
